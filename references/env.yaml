required:
  - name: REPLY_AUTHORITY_URL
    purpose: Reply Authority Service 基础地址
  - name: REPLY_AUTHORITY_BEARER_TOKEN
    purpose: Bearer token（Client Token 需 reply-policy scopes；Admin Token 可管辖多运营人员策略）

optional:
  - name: REPLY_AUTHORITY_TIMEOUT_MS
    purpose: HTTP 超时（毫秒，默认 30000）
  - name: REPLY_AUTHORITY_EVALUATE_TIMEOUT_MS
    purpose: evaluate 接口专用超时（毫秒，默认 90000；evaluate 涉及双路回放 + Judge，需更长超时）
  - name: REPLY_POLICY_TUNER_POLICY_JSON
    purpose: Tool 级确认策略配置 JSON（approvalTtlMs + tools 策略）
  - name: REPLY_POLICY_TUNER_PREVIEW_RECRUITER_USERNAME
    purpose: 可选 fallback；生产路径应由编排层通过 browser-use zhipin_get_username 显式传入 recruiterUsername
